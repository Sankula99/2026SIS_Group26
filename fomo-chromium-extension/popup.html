<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FOMO</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="popup-canvas">
    <div class="notepad-label" aria-hidden="true">FOMO NOTES</div>
    <div id="paperStack" class="paper-stack theme-yellow">
      <div class="stack-layer stack-layer-3" aria-hidden="true"></div>
      <div class="stack-layer stack-layer-2" aria-hidden="true"></div>
      <div class="stack-layer stack-layer-1" aria-hidden="true"></div>
      <section class="paper-sheet">
        <div class="tape" aria-hidden="true"></div>
        <main id="content" aria-live="polite"></main>
      </section>
    </div>

    <div id="toast" class="toast" role="status"></div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
