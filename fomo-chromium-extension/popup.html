<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FOMO</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="brand" id="homeBtn" aria-label="Go home">
        <span class="brand-mark">F</span>
        <span>
          <strong>FOMO</strong>
          <small>uni, together.</small>
        </span>
      </button>
      <div class="top-actions">
        <button class="icon-btn notification-button" id="notificationsBtn" title="Notifications">
          <span aria-hidden="true">♢</span>
          <span class="badge-dot" id="notificationDot">2</span>
        </button>
        <button class="icon-btn" id="settingsBtn" title="Settings">⚙</button>
      </div>
    </header>

    <main id="content" aria-live="polite"></main>

    <div id="toast" class="toast" role="status"></div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
